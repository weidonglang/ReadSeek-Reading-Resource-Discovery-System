[package]
name = "readseek-bench-rs"
version = "0.1.0"
edition = "2021"
description = "Rust retrieval/RAG/recommendation benchmark CLI for ReadSeek"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"

[dev-dependencies]
tempfile = "3.10"
